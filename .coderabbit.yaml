language: en-US
reviews:
  profile: assertive
  auto_review:
    enabled: true
  path_instructions:
    - path: "patches/**/*.patch"
      instructions: "Review the patch as upstream source code. Check whether branding or downstream-only changes leaked into a feature patch, and whether later patches can still replay."
    - path: "src/**/*.ts"
      instructions: "Check Git safety, conflict recovery, command failures, and whether PR branches contain exactly one clean feature commit."
