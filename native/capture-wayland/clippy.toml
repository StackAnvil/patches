allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

disallowed-methods = [
  { path = "std::env::set_var", reason = "Pass configuration explicitly or set the environment on a child with Command::env" },
  { path = "std::env::remove_var", reason = "Pass configuration explicitly or remove the variable from a child with Command::env_remove" },
]
