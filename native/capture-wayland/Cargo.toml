[package]
name = "capture-wayland"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Wayland window capture and bounded keyboard and pointer input for StackAnvil"
repository = "https://github.com/StackAnvil/patches"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
xkbcommon = "0.9"
tempfile = "3"

[dev-dependencies]
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }

[lints.rust]
unsafe_code = "forbid"
