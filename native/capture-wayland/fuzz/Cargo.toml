[package]
name = "capture-wayland-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "GPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

# Keep the fuzz crate out of the helper's build, Clippy and cargo-deny checks.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.capture-wayland]
path = ".."

[[bin]]
name = "ppm_pixel"
path = "fuzz_targets/ppm_pixel.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sway_reply"
path = "fuzz_targets/sway_reply.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sway_windows"
path = "fuzz_targets/sway_windows.rs"
test = false
doc = false
bench = false

[[bin]]
name = "input_request"
path = "fuzz_targets/input_request.rs"
test = false
doc = false
bench = false
