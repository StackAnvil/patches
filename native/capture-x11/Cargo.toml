[package]
name = "capture-x11"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "X11 window capture and bounded keyboard and pointer input for StackAnvil"
repository = "https://github.com/StackAnvil/patches"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
x11-keysymdef = "0.2"
x11rb = { version = "0.14", features = ["image", "xtest"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
