name: Build OreUI shaping engine

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
            arguments: ""
          - os: ubuntu-22.04-arm
            target: linux-arm64
            arguments: ""
          - os: windows-2025
            target: windows-x64
            arguments: -A x64
          - os: windows-11-arm
            target: windows-arm64
            arguments: -A ARM64
          - os: macos-15-intel
            target: macos-x64
            arguments: -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          - os: macos-15
            target: macos-arm64
            arguments: -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Configure compatible engine
        shell: bash
        run: cmake -S native/oreui-shaper -B .stackanvil/tools/oreui-shaper-build -DCMAKE_BUILD_TYPE=Release ${{ matrix.arguments }}
      - name: Build and test shaping
        shell: bash
        run: |
          cmake --build .stackanvil/tools/oreui-shaper-build --config Release --target oreui-shaping-test --parallel 2
          ctest --test-dir .stackanvil/tools/oreui-shaper-build -C Release --output-on-failure
      - name: Install and verify resources
        shell: bash
        run: |
          cmake --install .stackanvil/tools/oreui-shaper-build --config Release --prefix "$PWD/.stackanvil/tools/oreui-shaper-resources" --component OreUiShaper
          bun src/oreui-shaper.ts .stackanvil/tools/oreui-shaper-resources ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: oreui-shaper-${{ matrix.target }}
          path: .stackanvil/tools/oreui-shaper-resources/
          if-no-files-found: error
