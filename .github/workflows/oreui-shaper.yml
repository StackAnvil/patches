name: Build OreUI shaping engine

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
            arguments: ""
          - os: ubuntu-22.04-arm
            target: linux-arm64
            arguments: ""
          - os: windows-2025
            target: windows-x64
            arguments: -A x64
          - os: windows-11-arm
            target: windows-arm64
            arguments: -A ARM64
          - os: macos-15-intel
            target: macos-x64
            arguments: -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          - os: macos-15
            target: macos-arm64
            arguments: -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Build, test, and verify the engine
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CMAKE_ARGUMENTS: ${{ matrix.arguments }}
        run: |
          # The matrix arguments hold several words, so the variable stays unquoted.
          # shellcheck disable=SC2086
          bun src/oreui-shaper.ts build --target "$TARGET" --output .stackanvil/tools/oreui-shaper-resources -- $CMAKE_ARGUMENTS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oreui-shaper-${{ matrix.target }}
          path: .stackanvil/tools/oreui-shaper-resources/
          if-no-files-found: error
