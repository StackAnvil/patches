name: Build persona package helpers

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-2025
            platform: windows-x86_64
          - os: macos-15
            platform: macos-aarch64
          - os: macos-15-intel
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev protobuf-compiler
      - name: Install macOS protocol compiler
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install Windows protocol compiler
        if: runner.os == 'Windows'
        run: choco install protoc --no-progress -y
      - run: bun install --frozen-lockfile
      - run: bun run stack sync viafabricplus-bedrock
      - name: Build and test the helper
        shell: bash
        run: |
          cargo +1.98.1 test --locked --manifest-path .worktrees/viafabricplus-bedrock/native/persona-assets/Cargo.toml
          cargo +1.98.1 build --release --locked --manifest-path .worktrees/viafabricplus-bedrock/native/persona-assets/Cargo.toml
      - name: Prepare bundled resources
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "native-assets/$PLATFORM"
          bun -e 'import { createHash } from "node:crypto"; import { copyFile, writeFile } from "node:fs/promises"; const name = "persona-assets" + (process.platform === "win32" ? ".exe" : ""); const source = `.worktrees/viafabricplus-bedrock/native/persona-assets/target/release/${name}`; const target = `native-assets/${process.env.PLATFORM}/${name}`; await copyFile(source, target); await writeFile(`${target}.sha256`, createHash("sha256").update(await Bun.file(source).arrayBuffer()).digest("hex") + "\n");'
      - uses: actions/upload-artifact@v7
        with:
          name: persona-helper-${{ matrix.platform }}
          path: native-assets/
          if-no-files-found: error
