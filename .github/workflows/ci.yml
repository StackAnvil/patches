name: Check patch stacks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  replay_permissions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Test private capture files
        shell: bash
        run: |
          javac -d .stackanvil/replay-permissions src/replay/java/com/enderdash/agent/replay/PrivateFiles.java src/replay/java/com/enderdash/agent/replay/PacketJournal.java src/replay/java/com/enderdash/agent/replay/PrivateFilesSelfTest.java
          java -cp .stackanvil/replay-permissions com.enderdash.agent.replay.PrivateFilesSelfTest

  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run validate offline
      - name: Summarize offline validation
        if: always()
        run: |
          if [ -f dist/validation/offline.md ]; then
            cat dist/validation/offline.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: offline-validation
          path: dist/validation/
          if-no-files-found: warn

  capture_native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install isolated X11 test server
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: cargo fmt --manifest-path native/capture-x11/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path native/capture-x11/Cargo.toml --target-dir .stackanvil/tools/capture-x11-build --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path native/capture-x11/Cargo.toml --target-dir .stackanvil/tools/capture-x11-build -- --include-ignored

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            25
      - run: bun install --frozen-lockfile
      - run: bun run validate build
      - name: Summarize build validation
        if: always()
        run: |
          if [ -f dist/validation/build.md ]; then
            cat dist/validation/build.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-validation
          path: dist/validation/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: stack-bundle
          path: dist/
          if-no-files-found: error
