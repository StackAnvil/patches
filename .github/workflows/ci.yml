name: Check patch stacks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: viabedrock
            java: '17'
            north_star: true
          - project: viafabricplus-bedrock
            java: '25'
            north_star: true
          - project: cubeconverter
            java: '21'
            north_star: false
          - project: viafabricplus
            java: '25'
            north_star: false
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: bun install --frozen-lockfile
      - if: matrix.north_star
        run: bun run pr check ${{ matrix.project }}
      - run: bun run stack sync ${{ matrix.project }}
      - run: bun run build ${{ matrix.project }}
      - uses: actions/upload-artifact@v7
        with:
          name: stack-${{ matrix.project }}
          path: dist/${{ matrix.project }}/
          if-no-files-found: error
