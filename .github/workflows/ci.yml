name: Check patch stacks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  oreui_shaper:
    uses: ./.github/workflows/oreui-shaper.yml

  replay_permissions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
      - name: Test private capture files
        shell: bash
        run: |
          javac -d .stackanvil/replay-permissions src/replay/java/net/pistonmaster/stackanvil/replay/PrivateFiles.java src/replay/java/net/pistonmaster/stackanvil/replay/PacketJournal.java src/replay/java/net/pistonmaster/stackanvil/replay/PrivateFilesSelfTest.java
          java -cp .stackanvil/replay-permissions net.pistonmaster.stackanvil.replay.PrivateFilesSelfTest

  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run validate offline
      - name: Summarize offline validation
        if: always()
        run: |
          if [ -f dist/validation/offline.md ]; then
            cat dist/validation/offline.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: offline-validation
          path: dist/validation/
          if-no-files-found: warn

  capture_native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - name: Install native Wayland test tools
        run: sudo apt-get update && sudo apt-get install -y sway grim wf-recorder ffmpeg libxkbcommon-dev xkb-data
      - run: cargo fmt --manifest-path native/capture-wayland/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path native/capture-wayland/Cargo.toml --target-dir .stackanvil/tools/capture-wayland-build --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path native/capture-wayland/Cargo.toml --target-dir .stackanvil/tools/capture-wayland-build -- --include-ignored

  build:
    needs: oreui_shaper
    runs-on: ubuntu-26.04
    env:
      STACKANVIL_NATIVE_FONT_GPU_TESTS: "1"
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            17
            25
      - run: bun install --frozen-lockfile
      - name: Install software font rendering
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: oreui-shaper-*
          merge-multiple: true
          path: .stackanvil/tools/oreui-shaper-resources
      - run: bun run validate build
      - name: Summarize build validation
        if: always()
        run: |
          if [ -f dist/validation/build.md ]; then
            cat dist/validation/build.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: build-validation
          path: dist/validation/
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stack-bundle
          path: dist/
          if-no-files-found: error
