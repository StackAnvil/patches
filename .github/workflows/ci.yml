name: Check patch stacks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            25
      - run: bun install --frozen-lockfile
      - run: bun run pr check viabedrock
      - run: bun run pr check viafabricplus-bedrock
      - run: bun run build all
      - run: bun run bundle
      - uses: actions/upload-artifact@v7
        with:
          name: stack-bundle
          path: dist/
          if-no-files-found: error
