name: Check patch stacks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  replay_permissions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Test private capture files
        shell: bash
        run: |
          javac -d .stackanvil/replay-permissions src/replay/java/com/enderdash/agent/replay/PrivateFiles.java src/replay/java/com/enderdash/agent/replay/PacketJournal.java src/replay/java/com/enderdash/agent/replay/PrivateFilesSelfTest.java
          java -cp .stackanvil/replay-permissions com.enderdash.agent.replay.PrivateFilesSelfTest

  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            25
      - run: bun install --frozen-lockfile
      - run: bun run pr check viabedrock
      - run: bun run pr check viafabricplus-bedrock
      - run: bun run test-pack:java:build
      - run: bun run build all
      - run: bun run server-replay selftest
      - run: bun run bundle
      - uses: actions/upload-artifact@v7
        with:
          name: stack-bundle
          path: dist/
          if-no-files-found: error
