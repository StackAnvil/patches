name: Build a north-star PR
run-name: PR artifact ${{ inputs.project }} at ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project with a pending first upstreamable patch
        required: true
        type: choice
        options: [viabedrock, viafabricplus-bedrock, cubeconverter]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ inputs.project == 'cubeconverter' && '17' || '25' }}
      - run: bun install --frozen-lockfile
      - run: bun run pr build "$PROJECT"
        env:
          PROJECT: ${{ inputs.project }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-${{ inputs.project }}
          path: dist/pr/${{ inputs.project }}/
          if-no-files-found: error
