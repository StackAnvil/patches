name: Build a north-star PR
run-name: PR artifact ${{ inputs.project }} at ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project with a pending first feature patch
        required: true
        type: choice
        options: [viabedrock, viafabricplus-bedrock, cubeconverter, viafabricplus]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.project == 'cubeconverter' && '21' || inputs.project == 'viabedrock' && '17' || '25' }}
      - run: bun install --frozen-lockfile
      - run: bun run pr build "${{ inputs.project }}"
      - uses: actions/upload-artifact@v7
        with:
          name: pr-${{ inputs.project }}
          path: dist/pr/${{ inputs.project }}/
          if-no-files-found: error
