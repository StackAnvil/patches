name: Inspect upstream patch health

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

concurrency:
  group: patch-health
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run stack health all --upstream --output dist/patch-health.json
      - name: Summarize patch health
        if: always()
        run: |
          if [ -f dist/patch-health.md ]; then
            cat dist/patch-health.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: patch-health
          path: |
            dist/patch-health.json
            dist/patch-health.md
          if-no-files-found: warn
