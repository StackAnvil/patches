name: Release full stacks

on:
  push:
    tags: ["stack-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stackanvil-release
  cancel-in-progress: false

jobs:
  oreui_shaper:
    uses: ./.github/workflows/oreui-shaper.yml

  build:
    needs: oreui_shaper
    runs-on: ubuntu-26.04
    env:
      STACKANVIL_NATIVE_FONT_GPU_TESTS: "1"
      STACKANVIL_REQUIRE_ALL_OREUI_SHAPERS: "1"
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            17
            25
      - run: bun install --frozen-lockfile
      - name: Install software font rendering
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: oreui-shaper-*
          merge-multiple: true
          path: .stackanvil/tools/oreui-shaper-resources
      - run: bun run validate release
      - name: Summarize release validation
        if: always()
        run: |
          if [ -f dist/validation/release.md ]; then
            cat dist/validation/release.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-validation
          path: dist/validation/
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create publishes the release and its assets.
    outputs:
      release_tag: ${{ steps.create_release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: artifacts
      - run: bun src/release-assets.ts
      - run: bun src/release-notes.ts
      - name: Create release
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="stack-v0.0.${GITHUB_RUN_NUMBER}"
          fi
          gh release create "$tag" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "StackAnvil ${tag}" --notes-file release-notes.md
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

  publish_docker:
    needs: publish
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write # docker/build-push-action pushes the ViaProxy image to GHCR.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: artifacts
      - name: Prepare the image context
        id: context
        env:
          RELEASE_TAG: ${{ needs.publish.outputs.release_tag }}
        run: |
          shopt -s nullglob
          jars=(artifacts/viaproxy/ViaProxy-*-StackAnvil.jar)
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "::error::Expected one ViaProxy JAR, found ${#jars[@]}"
            exit 1
          fi
          mkdir docker-context
          cp docker/viaproxy/Dockerfile "${jars[0]}" docker-context/
          echo "version=${RELEASE_TAG#stack-v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/stackanvil/viaproxy
          tags: |
            type=raw,value=${{ steps.context.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=StackAnvil ViaProxy
            org.opencontainers.image.description=ViaProxy with the StackAnvil Bedrock patches
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker-context
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish_addon:
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/publish-vfp-vb-addon.yml
    with:
      release_tag: ${{ needs.publish.outputs.release_tag }}
      # platform: both
      platform: curseforge
    secrets:
      # MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
