name: Release full stacks

on:
  push:
    tags: ['stack-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stackanvil-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            25
      - run: bun install --frozen-lockfile
      - run: bun run build all
      - run: bun run bundle
      - uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: artifacts
      - run: bun src/release-notes.ts
      - run: bun src/release-assets.ts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="stack-v0.0.${GITHUB_RUN_NUMBER}"
          fi
          gh release create "$tag" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "StackAnvil ${tag}" --notes-file release-notes.md
