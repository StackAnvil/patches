name: Release full stacks

on:
  push:
    tags: ['stack-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stackanvil-release
  cancel-in-progress: false

jobs:
  oreui_shaper:
    uses: ./.github/workflows/oreui-shaper.yml

  build:
    needs: oreui_shaper
    runs-on: ubuntu-24.04
    env:
      STACKANVIL_NATIVE_FONT_GPU_TESTS: "1"
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            25
      - run: bun install --frozen-lockfile
      - name: Install software font rendering
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri
      - uses: actions/download-artifact@v8
        with:
          pattern: oreui-shaper-*
          merge-multiple: true
          path: .stackanvil/tools/oreui-shaper-resources
      - run: bun run validate release
      - name: Summarize release validation
        if: always()
        run: |
          if [ -f dist/validation/release.md ]; then
            cat dist/validation/release.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-validation
          path: dist/validation/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.create_release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: artifacts
      - run: bun src/release-assets.ts
      - run: bun src/release-notes.ts
      - name: Create release
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="stack-v0.0.${GITHUB_RUN_NUMBER}"
          fi
          gh release create "$tag" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "StackAnvil ${tag}" --notes-file release-notes.md
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

  publish_addon:
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/publish-vfp-vb-addon.yml
    with:
      release_tag: ${{ needs.publish.outputs.release_tag }}
      platform: both
    secrets:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
