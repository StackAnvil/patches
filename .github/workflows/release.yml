name: Release full stacks

on:
  push:
    tags: ['stack-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stackanvil-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: viabedrock
            java: '17'
          - project: viafabricplus-bedrock
            java: '25'
          - project: cubeconverter
            java: '21'
          - project: viafabricplus
            java: '25'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: bun install --frozen-lockfile
      - run: bun run build ${{ matrix.project }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.project }}
          path: dist/${{ matrix.project }}/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
      - run: bun src/release-notes.ts
      - name: Package and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          for project in viabedrock viafabricplus-bedrock cubeconverter viafabricplus; do
            tar -czf "release/${project}.tar.gz" -C "artifacts/release-${project}" .
          done
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="stack-v0.0.${GITHUB_RUN_NUMBER}"
          fi
          gh release create "$tag" release/*.tar.gz --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "StackAnvil ${tag}" --notes-file release-notes.md
