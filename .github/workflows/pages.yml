name: Publish website

on:
  push:
    branches: [main]
    paths:
      - site/**
      - scripts/discord-embed.ts
      - test/site-*.test.ts
      - test/discord-embed.test.ts
      - package.json
      - bun.lock
      - tsconfig.json
      - .oxlintrc.json
      - .oxfmtrc.json
      - .github/workflows/pages.yml
  workflow_dispatch:
  release:
    types: [published]
  # The release workflow runs only for stack-v* tags and manual dispatch. This build checks out
  # main and runs no code from the triggering run or from pull requests.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Release full stacks]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages site settings.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ (github.event_name == 'release' || github.event_name == 'workflow_run') && 'main' || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run site:check
      - run: bun test test/site-embeds.test.ts test/site-releases.test.ts
      - name: Build static site
        run: bun run site:build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install test browser
        working-directory: site
        run: bunx --no-install playwright install --with-deps chromium --only-shell
      - run: bun run site:test
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist/client
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write # deploy-pages publishes the uploaded site.
      id-token: write # deploy-pages authenticates with an OIDC token.
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
