name: Publish website

on:
  push:
    branches: [main]
    paths:
      - site/**
      - scripts/discord-embed.ts
      - test/site-*.test.ts
      - test/discord-embed.test.ts
      - package.json
      - bun.lock
      - tsconfig.json
      - .oxlintrc.json
      - .oxfmtrc.json
      - .github/workflows/pages.yml
  workflow_dispatch:
  release:
    types: [published]
  workflow_run:
    workflows: [Release full stacks]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ (github.event_name == 'release' || github.event_name == 'workflow_run') && 'main' || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run site:check
      - run: bun test test/site-embeds.test.ts test/site-releases.test.ts
      - name: Build static site
        run: bun run site:build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v6
      - name: Install test browser
        working-directory: site
        run: bunx --no-install playwright install --with-deps chromium --only-shell
      - run: bun run site:test
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist/client
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
