name: Publish VFP Bedrock add-on

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing StackAnvil GitHub release tag
        required: true
        type: string
      platform:
        description: Destination
        required: true
        type: choice
        options: [both, modrinth, curseforge]
        default: both

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'both' && '["modrinth","curseforge"]' || format('["{0}"]', inputs.platform)) }}
    concurrency:
      group: vfp-vb-addon-${{ inputs.release_tag }}-${{ matrix.platform }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Download the release JAR and build manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p publish-artifacts
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'viafabricplus-bedrock-*-StackAnvil.jar' \
            --pattern 'viafabricplus-bedrock-manifest.json' \
            --dir publish-artifacts
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > publish-changelog.md
      - name: Validate the upload
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bun run mod:publish prepare "$RELEASE_TAG" publish-artifacts/viafabricplus-bedrock-manifest.json publish-changelog.md
      - name: Upload to ${{ matrix.platform }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_VFP_VB_ADDON_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_VFP_VB_ADDON_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          PLATFORM: ${{ matrix.platform }}
        run: bun run mod:publish "$PLATFORM" "$RELEASE_TAG" publish-artifacts/viafabricplus-bedrock-manifest.json publish-changelog.md
