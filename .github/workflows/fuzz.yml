name: Fuzz

on:
  pull_request:
    paths:
      - "native/capture-wayland/Cargo.toml"
      - "native/capture-wayland/Cargo.lock"
      - "native/capture-wayland/src/**"
      - "native/capture-wayland/fuzz/**"
      - ".github/workflows/fuzz.yml"
  push:
    branches: [main]
    paths:
      - "native/capture-wayland/Cargo.toml"
      - "native/capture-wayland/Cargo.lock"
      - "native/capture-wayland/src/**"
      - "native/capture-wayland/fuzz/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  TOOLCHAIN: nightly-2026-11-01

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [ppm_pixel, sway_reply, sway_windows, input_request]
    defaults:
      run:
        working-directory: native/capture-wayland
    env:
      TARGET: ${{ matrix.target }}
      LONG_RUN: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install libxkbcommon
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - name: Install Rust
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-fuzz@0.13.2
          fallback: none
      - name: Restore corpus
        if: env.LONG_RUN == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/capture-wayland/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      # The cargo-fuzz release binary defaults to the musl target, which
      # AddressSanitizer does not support.
      - name: Build
        run: cargo "+$TOOLCHAIN" fuzz build --target x86_64-unknown-linux-gnu "$TARGET"
      - name: Run
        run: |
          seconds=60
          if [ "$LONG_RUN" = true ]; then seconds=600; fi
          mkdir -p "fuzz/corpus/$TARGET"
          cargo "+$TOOLCHAIN" fuzz run --target x86_64-unknown-linux-gnu "$TARGET" \
            "fuzz/corpus/$TARGET" "fuzz/seeds/$TARGET" \
            -- -max_total_time="$seconds" -rss_limit_mb=2048 -timeout=10
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: native/capture-wayland/fuzz/artifacts/
          if-no-files-found: ignore
