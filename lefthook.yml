lefthook: bunx --no-install lefthook
min_version: 2.2.2

pre-commit:
  piped: true
  jobs:
    - name: lint
      glob: "{src,scripts}/**/*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
      run: bunx --no-install oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: format
      glob: "{src/**,scripts/**,package.json,tsconfig.json,knip.json,.oxlintrc.json,.oxfmtrc.json,lefthook.yml,.github/workflows/ci.yml,ruff.toml}"
      run: bunx --no-install oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: native-format
      glob:
        ["native/capture-wayland/*.{rs,toml,lock}", "native/capture-wayland/**/*.{rs,toml,lock}"]
      run: cargo fmt --manifest-path native/capture-wayland/Cargo.toml -- --check
    - name: python
      glob: "*.py"
      run: |
        if ! command -v ruff >/dev/null 2>&1; then
          echo 'Ruff is required. Install it with pipx install ruff==0.16.0.' >&2
          exit 1
        fi
        ruff check {staged_files} && ruff format --check {staged_files}

commit-msg:
  commands:
    conventional-commit:
      run: |
        if ! head -n 1 "{1}" | grep -Eq '^(Merge |Revert "|fixup! |squash! |amend! |(feat|fix|docs|refactor|test|chore|ci|build|perf|style|revert)(\([^()[:space:]]+\))?!?: [^[:space:]].*$)'; then
          echo 'Use a Conventional Commit subject, for example: fix(capture): handle missing files' >&2
          exit 1
        fi

pre-push:
  commands:
    check:
      glob: "{*.{ts,tsx,js,mjs,json,jsonc},site/**/*.{jsx,cjs,mts,cts,css,scss,md,mdx}}"
      run: bun run check
    native-clippy:
      glob:
        ["native/capture-wayland/*.{rs,toml,lock}", "native/capture-wayland/**/*.{rs,toml,lock}"]
      run: cargo clippy --locked --manifest-path native/capture-wayland/Cargo.toml --target-dir .stackanvil/tools/capture-wayland-build --all-targets -- -D warnings
    cargo-deny:
      glob: ["native/capture-wayland/Cargo.toml", "native/capture-wayland/Cargo.lock", "deny.toml"]
      run: cargo deny --manifest-path native/capture-wayland/Cargo.toml --config deny.toml --locked check
